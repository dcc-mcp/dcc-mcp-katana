name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python tools/lint_skills.py

  # The pinned upper bound keeps the main matrix reproducible, but it also hides
  # incompatibilities until a bump lands. This job deliberately runs against the newest
  # published Core -- including versions the pin excludes -- so a Core minor that breaks the
  # Install SOP contract shows up here instead of silently landing in the main matrix.
  core-latest:
    name: core-latest compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Resolve newest Core
        id: core
        run: |
          python -m pip install --upgrade pip
          version=$(python -m pip index versions dcc-mcp-core \
            | tr ',' '\n' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          # Fail loudly here rather than silently testing an empty pin: this job exists only
          # to warn about new Core releases, so a run that resolved nothing would otherwise
          # still report success.
          if [ -z "${version}" ]; then
            echo "::error::could not resolve newest dcc-mcp-core version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved dcc-mcp-core ${version}"

      - name: Install adapter with newest Core
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade "dcc-mcp-core==${{ steps.core.outputs.version }}"
          python -m pip show dcc-mcp-core

      - name: Install SOP contract against newest Core
        run: python -m pytest tests/test_install_lifecycle.py -v --tb=short

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
