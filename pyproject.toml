[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-katana"
version = "0.5.0"
description = "MCP adapter for Foundry Katana"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12"]
# The upper bound is pinned to the 0.20.x series: ``<1.0.0`` admitted any future minor, so
# a Core minor release could silently break this adapter -- 0.20.34 changed the Install SOP
# schema version. Failing at dependency resolution is louder and cheaper than emitting
# reports Core rejects.
dependencies = ["dcc-mcp-core>=0.19.45,<0.21.0"]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-katana"
Repository = "https://github.com/dcc-mcp/dcc-mcp-katana"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8", "twine>=6", "pyyaml>=5.0"]

[project.scripts]
dcc-mcp-katana = "dcc_mcp_katana.cli:main"

[project.entry-points."dcc_mcp.adapters"]
katana = "dcc_mcp_katana:KatanaMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_katana"]
artifacts = ["src/dcc_mcp_katana/skills/**", "src/dcc_mcp_katana/katana_plugin/**"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/**/*.png", "docs/**/*.svg", "docs/**/*.webp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
